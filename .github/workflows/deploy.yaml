name: Notify Discord on Cloudflare Deploy

on:
  # Triggers when Cloudflare or GitHub updates a commit status check
  status:

jobs:
  notify:
    runs-on: ubuntu-latest
    # Only run if the status update is coming from Cloudflare Pages
    if: github.event.context == 'Cloudflare Pages'
    steps:
      - name: Send Success Notification
        if: github.event.state == 'success'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "🚀 Cloudflare Pages Deployment Success!",
                   "description": "Cloudflare has successfully built and deployed your commit.",
                   "color": 3066993,
                   "fields": [
                     { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
                     { "name": "Target URL", "value": "${{ github.event.target_url }}" }
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Failure Notification
        if: github.event.state == 'failure' || github.event.state == 'error'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "❌ Cloudflare Pages Deployment Failed",
                   "description": "The internal Cloudflare Pages build failed.",
                   "color": 15158332,
                   "fields": [
                     { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
                     { "name": "Details", "value": "[View Build Log](${{ github.event.target_url }})" }
                   ]
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
