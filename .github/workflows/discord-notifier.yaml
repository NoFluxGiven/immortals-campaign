name: Discord Commit Notifier

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    # The job-level or step-level 'if' handles the string filtering
    if: contains(join(github.event.commits.*.message, ' '), '[notify]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Discord Notification
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          message: |
            📚 **The Wiki has been updated**

            🔗 [View the Wiki](https://immortals-campaign.org)
