name: Discord Wiki Notifier

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(join(github.event.commits.*.message, ' '), '[notify]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Pulls the complete history tree so git log can safely look backwards
          fetch-depth: 0

      - name: Analyze Wiki Changes
        id: wiki_stats
        run: |
          # 1. Find the baseline: Locate the second most recent commit containing [notify]
          # (The most recent one is the current HEAD pushing right now)
          BASE_SHA=$(git log --grep="\[notify\]" --format="%H" -n 2 | sed -n '2p' || true)

          # Fallback mechanism: If this is the first [notify] push ever, look back to the parent commit
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="${{ github.event.before }}"
          fi

          # Absolute safe boundary fallback for initial or empty repository histories
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
            BASE_SHA="HEAD~1"
          fi

          # 2. Identify Raw File Changes (Accumulated since the historic BASE_SHA)
          NEW_FILES=$(git diff --name-only --diff-filter=A $BASE_SHA HEAD -- content/ | grep '\.md$' || true)
          BASE_ADDED=$(echo "$NEW_FILES" | grep -v '^$' | wc -l || echo "0")

          DRAFT_PUBLISHED_FILES=""
          DRAFT_PUBLISHED_COUNT=0
          MODIFIED_FILES=$(git diff --name-only --diff-filter=M $BASE_SHA HEAD -- content/ | grep '\.md$' || true)

          if [ -n "$MODIFIED_FILES" ]; then
            while IFS= read -r file; do
              if git diff $BASE_SHA HEAD -- "$file" | grep -E '^\+\s*draft:\s*false' > /dev/null; then
                DRAFT_PUBLISHED_COUNT=$((DRAFT_PUBLISHED_COUNT + 1))
                DRAFT_PUBLISHED_FILES+="$file"$'\n'
              fi
            done <<< "$MODIFIED_FILES"
          fi

          # Core Metrics
          TOTAL_ADDED=$((BASE_ADDED + DRAFT_PUBLISHED_COUNT))
          TOTAL_MODIFIED=$(echo "$MODIFIED_FILES" | grep -v '^$' | wc -l || echo "0")
          TOTAL_UPDATED=$((TOTAL_MODIFIED - DRAFT_PUBLISHED_COUNT))
          if [ "$TOTAL_UPDATED" -lt 0 ]; then TOTAL_UPDATED=0; fi

          # 3. Extract Top 5 Most Recently Added Pages
          ALL_ADDED_FILES=$(printf "%s\n%s" "$NEW_FILES" "$DRAFT_PUBLISHED_FILES" | grep -v '^$' | sort -u || true)
          ADDED_BLOCK=""
          if [ -n "$ALL_ADDED_FILES" ]; then
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                SLUG=$(echo "$file" | sed 's/^content\///' | sed 's/\.md$//')
                SLUG_URL=$(echo "$SLUG" | sed 's/ /-/g' | sed 's/(/%28/g; s/)/%29/g')
                
                TITLE=$(grep -m 1 '^title:' "$file" | sed 's/^title:\s*//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//" || true)
                if [ -z "$TITLE" ]; then
                  TITLE=$(basename "$file" .md)
                fi
                
                ADDED_BLOCK+="  • [$TITLE](<https://immortals-campaign.org>)"$'\n'
              fi
            done < <(while IFS= read -r f; do echo "$(git log -1 --format='%at' -- "$f") $f"; done <<< "$ALL_ADDED_FILES" | sort -rn | cut -d' ' -f2- | head -n 5)
          fi

          # 4. Extract Top 5 Most Recently Refined Pages
          REFINED_FILES=""
          if [ -n "$MODIFIED_FILES" ]; then
            while IFS= read -r file; do
              if ! echo "$DRAFT_PUBLISHED_FILES" | grep -qxF "$file"; then
                REFINED_FILES+="$file"$'\n'
              fi
            done <<< "$MODIFIED_FILES"
          fi
          REFINED_FILES=$(echo "$REFINED_FILES" | grep -v '^$')

          UPDATED_BLOCK=""
          if [ -n "$REFINED_FILES" ]; then
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                SLUG=$(echo "$file" | sed 's/^content\///' | sed 's/\.md$//')
                SLUG_URL=$(echo "$SLUG" | sed 's/ /-/g' | sed 's/(/%28/g; s/)/%29/g')
                
                TITLE=$(grep -m 1 '^title:' "$file" | sed 's/^title:\s*//' | sed 's/^"//;s/"$//' | sed "s/^'//;s/'$//" || true)
                if [ -z "$TITLE" ]; then
                  TITLE=$(basename "$file" .md)
                fi
                
                UPDATED_BLOCK+="  • [$TITLE](<https://immortals-campaign.org>)"$'\n'
              fi
            done < <(while IFS= read -r f; do echo "$(git log -1 --format='%at' -- "$f") $f"; done <<< "$REFINED_FILES" | sort -rn | cut -d' ' -f2- | head -n 5)
          fi

          # 5. Folder Domains Impacted
          ALL_FILES=$(git diff --name-only --diff-filter=AM $BASE_SHA HEAD -- content/)
          FOLDERS=$(echo "$ALL_FILES" | xargs -I {} dirname {} | sort -u | grep -v '^\.$' | sed 's/^content\///' | sed 's/^/• `/' | sed 's/$/`/' | tr '\n' ',' | sed 's/,$//' | sed 's/,/\n/g')
          if [ -z "$FOLDERS" ]; then FOLDERS="• None"; fi

          # Export Output Chains to GitHub environment
          echo "added_count=$TOTAL_ADDED" >> $GITHUB_OUTPUT
          echo "updated_count=$TOTAL_UPDATED" >> $GITHUB_OUTPUT

          echo "changed_folders<<EOF" >> $GITHUB_OUTPUT
          echo "$FOLDERS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "added_links_block<<EOF" >> $GITHUB_OUTPUT
          echo "$ADDED_BLOCK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "updated_links_block<<EOF" >> $GITHUB_OUTPUT
          echo "$UPDATED_BLOCK" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Broadcast to Discord Webhook
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          message: |
            ✨ **The Wiki has been updated**

            ---

            🟢 **New:** ${{ steps.wiki_stats.outputs.added_count }} *new notes*
            ${{ steps.wiki_stats.outputs.added_links_block }}

            🔄 **Updated:** ${{ steps.wiki_stats.outputs.updated_count }} *existing notes updated*
            ${{ steps.wiki_stats.outputs.updated_links_block }}

            📂 **Affected Folders:**
            ${{ steps.wiki_stats.outputs.changed_folders }}

            ---

            🔗 [Explore the Wiki](https://immortals-campaign.org)
