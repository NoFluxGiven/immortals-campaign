name: Discord Wiki Notifier

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(join(github.event.commits.*.message, ' '), '[notify]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Calculate Added, Updated, and Folders
        id: git_stats
        run: |
          # Find the parent commit hash safely
          BASE_SHA="${{ github.event.before }}"
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
            BASE_SHA="HEAD~1"
          fi

          # 1. Count Added Files only inside 'content/' (--diff-filter=A)
          ADDED_FILES=$(git diff --name-only --diff-filter=A $BASE_SHA HEAD -- content/)
          ADDED_COUNT=$(echo "$ADDED_FILES" | grep -v '^$' | wc -l || echo "0")

          # 2. Count Updated Files only inside 'content/' (--diff-filter=M)
          UPDATED_FILES=$(git diff --name-only --diff-filter=M $BASE_SHA HEAD -- content/)
          UPDATED_COUNT=$(echo "$UPDATED_FILES" | grep -v '^$' | wc -l || echo "0")

          # 3. Aggregate all affected folders inside 'content/'
          ALL_FILES=$(git diff --name-only --diff-filter=AM $BASE_SHA HEAD -- content/)

          # Isolate, deduplicate, and format parent folders
          FOLDERS=$(echo "$ALL_FILES" | xargs -I {} dirname {} | sort -u | grep -v '^\.$' | sed 's/^/• `/' | sed 's/$/`/' | tr '\n' ',' | sed 's/,$//' | sed 's/,/\n/g')

          # Fallback handling if no files inside 'content/' were added or modified
          if [ -z "$FOLDERS" ]; then
            FOLDERS="• None"
          fi

          # Save counts to GitHub Outputs
          echo "added_count=$ADDED_COUNT" >> $GITHUB_OUTPUT
          echo "updated_count=$UPDATED_COUNT" >> $GITHUB_OUTPUT

          # Save folder block with multiline delimiter handling
          echo "changed_folders<<EOF" >> $GITHUB_OUTPUT
          echo "$FOLDERS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          message: |
            📚 **The Wiki has been updated**

            🟢 **Documents Added:** ${{ steps.git_stats.outputs.added_count }}
            🟡 **Documents Updated:** ${{ steps.git_stats.outputs.updated_count }}

            📂 **Folders Affected:**
            ${{ steps.git_stats.outputs.changed_folders }}

            🔗 [View the Wiki](https://immortals-campaign.org)
